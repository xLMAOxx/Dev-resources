<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Developer Resources</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        
        <article>
            <div id="logo">
                <p><b>Dev Resources</b></p>
            </div>
            <div id="postDiv">
                <form id="postForm">
                    <div class="formGroup"> 
                        <label for="title">Title</label> 
                        <input type="text" id="title" name="title" required> 
                    </div>

                    <div class="formGroup">
                        <label for="url">URL</label> 
                        <input type="text" id="url" name="url">
                    </div>

                    <div class="formGroup">
                        <label for="discription">Discription</label>
                        <textarea name="discription" id="discription" required></textarea>
                    </div>

                    <div class="formGroup">
                        <input type="submit" value="Submit" id="submitbtn"/>
                    </div>
                    
                </form>
            </div>
        </article>
        
                        <!--search bar-->
        <div id="searchBar">
            <input type="text" id="search" placeholder="search post">
        </div>
        
                         <!--POST FEEDd-->

        <section id="home-feed">
            <h1>HOME</h1>
            <div id="feed">
                 <div id="posts">
                    <!--<div class="addingPosts"> title <br> url <br> text</div>-->
                 </div>
            </div>
           
        </section>
        
    </body>
</html>
