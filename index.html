<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Developer Resources</title>
        <style>
            body{
                margin: 0;
                padding: 0;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: #535353;
            }
            article{
                display: flex;
                flex-direction: column;
                width: 13%;
                height: 100vh;
                padding: 1em;
                box-shadow: 0.5em -1em 1em rgba(213, 213, 213, 0.5);
                position: sticky;
            }
            #logo{
                border-radius: 10em;
                border: 0.3em double #17addb;
                border-radius: 3em;
                height: 4em;
                width: auto;
                text-align: center;
                color:#0c7fda;

            }            
            #submit{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color:#535353;
                margin: 10em 0;
            }
            submit:focus{
                outline: none;
                border-color: #0c7fda;
            }
            #discription{
                height: 10em;
                border-radius: 0.5em;
                border-style: solid;
            }
            #postDiv{
                flex-direction: column;
                display: flex;
            }
            #postForm{
                display: flex;
                flex-direction: column;
            }
            .formGroup{
                display: flex;
                flex-direction: column;
                margin: 1rem;
                padding-top: 1em;
            }
            label {
                display: inline-block;
                width: 6em;
            }

            input {
                padding: 0.3em;
                border-style: solid;
                border-radius: 3em;
            }
            input:hover{
                background-color: #e9f5fe;
            }
            input:focus{
                outline: none;
                border-color: #0c7fda;
            }
            

        </style>

    </head>
    <body>
        <article>
            <div id="logo">
                <p><b>Dev Resources</b></p>
            </div>
            <div id="postDiv">
                <form id="postForm">
                    <div class="formGroup"> 
                        <label for="title">Title</label> 
                        <input type="text" id="title" name="title" required> 
                    </div>

                    <div class="formGroup">
                        <label for="url">URL</label> 
                        <input type="text" id="url" name="url">
                    </div>

                    <div class="formGroup">
                        <label for="discription">Discription</label>
                        <textarea name="discription" id="discription" required></textarea>
                    </div>

                    <div class="formGroup">
                        <input type="submit" value="Submit" id="submit"/>
                    </div>
                    
                </form>
            </div>
        </article>
    </body>
</html>
