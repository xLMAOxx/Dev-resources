<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Developer Resources</title>
        <script src="script.js" defer></script>
        <style>

            body{
                margin: 0;
                padding: 0;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: #535353;
                display: grid;
                display: grid;
                grid-template-columns: 13%;
                grid-template-rows: 2rem 100vh;
            }
            article{
                display: flex;
                flex-direction: column;
                height: 100vh;
                padding: 2em 1em;
                box-shadow: 0.5em -1em 1em rgba(213, 213, 213, 0.5);
                position: sticky;
            }
            #logo{
                border-radius: 10em;
                border: 0.3em double #17addb;
                border-radius: 3em;
                height: 4em;
                width: auto;
                text-align: center;
                color:#0c7fda;

            }            
            #submitbtn{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color:#535353;
                margin: 10em 0;
            }
            submit:focus{
                outline: none;
                border-color: #0c7fda;
            }
            submit:active{
                background: red;
            }
            #discription{
                height: 10em;
                border-radius: 0.5em;
                border-style: solid;
            }
            #postDiv{
                flex-direction: column;
                display: flex;
            }
            #postForm{
                display: flex;
                flex-direction: column;
            }
            .formGroup{
                display: flex;
                flex-direction: column;
                margin: 1rem;
                padding-top: 1em;
            }
            label {
                display: inline-block;
                width: 6em;
            }

            input {
                padding: 0.3em;
                border-style: solid;
                border-radius: 3em;
            }
            input:hover{
                background-color: #e9f5fe;
            }
            input:focus{
                outline: none;
                border-color: #0c7fda;
            }

                        /*FOR POST FEED*/


            #home-feed{
                margin-top: 5em;
                padding-left: 2em;
                position: relative;
                background-color: #eff2f4;
                height: 100%;
                grid-column-start: 2;

            }
            /*#feed{
                padding: 1em;
                position: absolute;
                min-height: 60vh;
                top: 6em;
                bottom: 2em;
                left: 2em;
                right: 2em;
                background-color: white;
                border-radius: 0.7em;
            }*/
            #posts{
                border: 2px solid #0080001f;
            }
            #searchBar{
                padding: 2.5rem;
            }
            #search{
                width: 30%;
                padding: 0.7em;
                background-color: #eff2f4;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }
            .addingPost{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                padding: 1em;
                background-color: white;
                border-radius: 0.7em;
                text-align: center;
                margin: 0 40% 1em 0;
                word-break: break-word;
                overflow-wrap: break-word;
            }

        </style>
        
    </head>
    <body>
        
        <article>
            <div id="logo">
                <p><b>Dev Resources</b></p>
            </div>
            <div id="postDiv">
                <form id="postForm">
                    <div class="formGroup"> 
                        <label for="title">Title</label> 
                        <input type="text" id="title" name="title" required> 
                    </div>

                    <div class="formGroup">
                        <label for="url">URL</label> 
                        <input type="text" id="url" name="url">
                    </div>

                    <div class="formGroup">
                        <label for="discription">Discription</label>
                        <textarea name="discription" id="discription" required></textarea>
                    </div>

                    <div class="formGroup">
                        <input type="submit" value="Submit" id="submitbtn"/>
                    </div>
                    
                </form>
            </div>
        </article>
        
                        <!--search bar-->
        <div id="searchBar">
            <input type="text" id="search" placeholder="search post">
        </div>
        
                         <!--POST FEEDd-->

        <section id="home-feed">
            <h1>HOME</h1>
            <div id="feed">
                 <div id="posts">
                    <!--<div class="addingPosts"> title <br> url <br> text</div>-->
                 </div>
            </div>
           
        </section>
        
    </body>
</html>
